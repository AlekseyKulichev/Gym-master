name: Java tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Compile and run tests
        run: |
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.14.0/junit-platform-console-standalone-1.14.0.jar \
            --output junit-platform-console-standalone.jar
          mkdir -p build/classes
          javac -encoding UTF-8 -classpath junit-platform-console-standalone.jar \
            -d build/classes src/*.java
          java -jar junit-platform-console-standalone.jar execute \
            --class-path build/classes \
            --scan-class-path \
            --fail-if-no-tests
